name: Build NoSandbox dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          brew install ldid
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Build dylib
        run: |
          make clean && make
          file .theos/obj/debug/NoSandbox.dylib

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoSandbox-dylib
          path: .theos/obj/debug/NoSandbox.dylib
          if-no-files-found: error
